<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Адаптивное издание · Андрей Вознесенский</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="container">
  <header class="header">
    <div class="title-group">
      <h1>Андрей Вознесенский</h1>
      <div class="sub">адаптивное издание · стихи по критериям</div>
    </div>
    <div class="nav-links">
      <a href="#" id="projectLink">○ описание проекта</a>
      <a href="#" id="randomLink">◇ случайное стихотворение</a>
    </div>
  </header>

  <div class="filters">
    <div class="filter-group">
      <span class="filter-label">стих</span>
      <div class="btn-group" id="verseFilter">
        <button class="btn" data-value="classic">классический</button>
        <button class="btn" data-value="nonclassic">неклассический</button>
      </div>
    </div>

    <div class="filter-group">
      <span class="filter-label">сложность</span>
      <div class="btn-group" id="complexityFilter">
        <button class="btn" data-value="simple">простой</button>
        <button class="btn" data-value="complex">сложный</button>
      </div>
    </div>

    <div class="filter-group">
      <span class="filter-label">тематика</span>
      <select id="topicSelect">
        <option value="все">все темы</option>
      </select>
    </div>
  </div>

  <div class="poem-card" id="poemCard">
    <div class="poem-title" id="poemTitle">Загрузка...</div>
    <div class="poem-meta" id="poemMeta">
      <span><i>стих</i> <span id="metaVerse">—</span></span>
      <span><i>сложность</i> <span id="metaComplexity">—</span></span>
      <span><i>тема</i> <span id="metaTopic">—</span></span>
    </div>
    <div class="poem-body" id="poemBody">
      <p>Пожалуйста, подождите, идет загрузка корпуса...</p>
    </div>
  </div>

  <div class="action-bar">
    <div class="left">
      <button class="action-btn" id="resetBtn"> сброс</button>
      <button class="action-btn primary random-btn" id="randomBtn"> случайное</button>
      <button class="action-btn nav-btn" id="prevBtn"><span class="arrow">◀</span> назад</button>
      <button class="action-btn nav-btn" id="nextBtn">вперёд <span class="arrow">▶</span></button>
    </div>
    <div style="font-size:0.85rem; color:#6b5f55;">
      <span id="poemCountInfo">показано: 0</span>
    </div>
  </div>

  <div class="footer">
    <span>поэзия Андрея Вознесенского · адаптивный интерфейс</span>
    <span style="margin-left:1rem;">|</span>
    <a href="#" id="footerProjectLink">описание проекта</a>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
